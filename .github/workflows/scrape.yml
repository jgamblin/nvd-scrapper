name: scrape-and-publish

on:
  # The hourly trigger is NOT this file. It is the Cloudflare Worker in
  # worker/, whose cron fires at :38 and calls the workflow_dispatch API
  # below. GitHub's own scheduler could not hold an hourly cadence: in the 19h
  # after moving from 3-hourly to hourly at :38 it created 5 runs, none at
  # :38, and none cancelled -- the events were simply never created. Moving
  # off minute 0 and quadrupling the request rate did not raise delivery, so
  # the problem is the scheduler, not the slot.
  #
  # This schedule is only a daily fallback so the mirror still refreshes if
  # the Worker or its token breaks. It sits at an off-peak minute away from
  # the Worker's :38; if the two ever coincide, the concurrency group below
  # serialises them and the second run is a harmless idempotent re-scrape.
  #
  # healthchecks.io: period 1h, grace 3h. The 12h grace was sized for GitHub
  # scheduling outages (gap p90 5.8h / max 14.5h at 3-hourly), which no longer
  # sit on the primary path. 3h covers one run that needs its full retry. A
  # longer silence now means the Worker is down and only this daily fallback
  # is running, which is worth being paged for rather than absorbed.
  schedule:
    - cron: "51 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Needed to open/update/close the failure-tracking issue.
  issues: write

concurrency:
  group: scrape-and-publish
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Retry once on transient failures (NIST outages, runner hiccups).
      # The scraper is idempotent, so a second attempt re-runs from scratch.
      - name: Run scraper
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          # Two attempts have to fit inside the job's 180-minute budget, so
          # cap each one at 80. A healthy run finishes in 5-40 minutes; the
          # long tail was the REST API fallback, which no longer runs.
          timeout_minutes: 80
          max_attempts: 2
          command: python3 nvd.py

      # Proves metadata.json describes the exact bytes we are about to upload
      # (size + SHA-256), that the array is not truncated, that the run is not
      # degraded, and that the file has not shrunk against what is already
      # published. Replaces a fixed 100 MB floor that was ~5% of the real file
      # size and so never fired on any regression that reached consumers.
      - name: Verify manifest matches output
        run: python3 verify_manifest.py

      - name: Install rclone
        uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          mkdir -p ~/.config/rclone
          {
            echo '[r2]'
            echo 'type = s3'
            echo 'provider = Cloudflare'
            echo "access_key_id = $R2_ACCESS_KEY_ID"
            echo "secret_access_key = $R2_SECRET_ACCESS_KEY"
            echo "endpoint = https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
            echo 'acl = private'
          } > ~/.config/rclone/rclone.conf

      - name: Upload to R2
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          rclone copyto --s3-chunk-size 64M --s3-upload-concurrency 4 --s3-no-check-bucket \
            --header-upload "Content-Type: application/json" \
            --header-upload "Cache-Control: public, max-age=900" \
            nvd.json "r2:$R2_BUCKET/nvd.json"
          rclone copyto --s3-chunk-size 64M --s3-upload-concurrency 4 --s3-no-check-bucket \
            --header-upload "Content-Type: application/json" \
            --header-upload "Cache-Control: public, max-age=900" \
            nvd.jsonl "r2:$R2_BUCKET/nvd.jsonl"
          rclone copyto --s3-no-check-bucket \
            --header-upload "Content-Type: application/json" \
            --header-upload "Cache-Control: no-cache" \
            metadata.json "r2:$R2_BUCKET/metadata.json"
          rclone copyto --s3-no-check-bucket \
            --header-upload "Content-Type: text/html; charset=utf-8" \
            --header-upload "Cache-Control: public, max-age=300" \
            index.html "r2:$R2_BUCKET/index.html"

      # nvd.json and nvd.jsonl are 1.7 GB, well past Cloudflare's 512 MB max
      # cacheable file size, so they always serve cf-cache-status: DYNAMIC and
      # this purge is a no-op for them. It is load-bearing for index.html and
      # metadata.json; the large keys stay listed only so this keeps working
      # if the object ever drops below the limit.
      - name: Purge Cloudflare cache for nvd subdomain
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl --fail -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://nvd.handsonhacking.org/","https://nvd.handsonhacking.org/index.html","https://nvd.handsonhacking.org/nvd.json","https://nvd.handsonhacking.org/nvd.jsonl","https://nvd.handsonhacking.org/metadata.json"]}'

      # Tell cve.icu there is a new snapshot so it rebuilds now instead of at
      # its next hourly cron, which GitHub drops as often as it drops ours.
      # Only reached after a clean publish and purge: every refusal upstream
      # of this (shrink guard, stale feed build, verify_manifest) fails the
      # job, and default step gating skips everything after a failure.
      #
      # continue-on-error plus the warning keeps a broken or expired token
      # from failing the scrape. The data is already published, and cve.icu's
      # own cron still picks it up; the only cost is latency.
      - name: Notify cve.icu of new snapshot
        continue-on-error: true
        env:
          CVE_ICU_DISPATCH_TOKEN: ${{ secrets.CVE_ICU_DISPATCH_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "$CVE_ICU_DISPATCH_TOKEN" ]; then
            echo "::warning title=cve.icu not notified::CVE_ICU_DISPATCH_TOKEN is not set"
            exit 0
          fi
          status="$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' --retry 2 -X POST \
            https://api.github.com/repos/rogolabs/cve.icu/dispatches \
            -H "Authorization: Bearer $CVE_ICU_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"nvd-published"}')"
          if [ "$status" != "204" ]; then
            echo "::warning title=cve.icu not notified::repository_dispatch returned HTTP $status: $(head -c 500 /tmp/dispatch.out)"
          else
            echo "cve.icu notified (HTTP 204)"
          fi

      - name: Ping healthchecks.io
        if: success()
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: curl --fail --retry 3 "$HEALTHCHECKS_PING_URL"

      # On failure, last-known-good in R2 is untouched (upload only runs on a
      # clean scrape). Open or update a single tracking issue so a failure is
      # visible instead of buried in the Actions tab.
      - name: Open or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create scrape-failure --color B60205 \
            --description "Automated: scrape pipeline failure" --force || true
          ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          body=$(printf '%s\n\n%s\n%s\n\n%s' \
            "The scrape-and-publish run failed." \
            "When (UTC): $ts" \
            "Run log: $RUN_URL" \
            "Last-known-good data in R2 is untouched (upload only runs on a clean scrape).")
          existing="$(gh issue list --state open --label scrape-failure \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Scrape pipeline failure" \
              --label scrape-failure --body "$body"
          fi

      # When a run succeeds again, close any open failure issue so it doubles
      # as a recovered/not-recovered signal.
      - name: Close failure issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --state open --label scrape-failure \
            --json number --jq '.[].number'); do
            gh issue comment "$n" --body "Recovered: a later run succeeded. $RUN_URL"
            gh issue close "$n"
          done
